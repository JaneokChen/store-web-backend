services:
  servers:
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - 3333:3333
    networks:
      - nest-net
    volumes:
      - upload:/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    container_name: mysql
    image: mysql:8
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=store_web_project
    networks:
      - nest-net
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    networks:
      - nest-net
    volumes:
      - redis:/data

networks:
  nest-net:
    driver: bridge

volumes:
  mysql:
  redis:
  upload:
